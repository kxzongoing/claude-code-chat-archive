<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Claude Code Chat Archive — your conversations, kept.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14121f"/>
      <stop offset="52%" stop-color="#191a2b"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b87ff"/>
      <stop offset="100%" stop-color="#4fd1c5"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b87ff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#8b87ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vanish" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity=".03"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>

  <!-- transcript lines: solid on the left, dissolving to the right (the prune) -->
  <g transform="translate(726 58)">
    <g fill="url(#vanish)">
      <rect x="0"   y="0"   width="300" height="9" rx="4.5" opacity=".95"/>
      <rect x="22"  y="26"  width="248" height="9" rx="4.5" opacity=".82"/>
      <rect x="0"   y="52"  width="322" height="9" rx="4.5" opacity=".70"/>
      <rect x="22"  y="78"  width="214" height="9" rx="4.5" opacity=".56"/>
      <rect x="0"   y="104" width="288" height="9" rx="4.5" opacity=".42"/>
      <rect x="22"  y="130" width="176" height="9" rx="4.5" opacity=".30"/>
      <rect x="0"   y="156" width="240" height="9" rx="4.5" opacity=".20"/>
      <rect x="22"  y="182" width="150" height="9" rx="4.5" opacity=".11"/>
    </g>
    <!-- the archived ones stay lit -->
    <g fill="#8b87ff">
      <rect x="-64" y="0"   width="44" height="9" rx="4.5" opacity=".9"/>
      <rect x="-64" y="26"  width="44" height="9" rx="4.5" opacity=".9"/>
      <rect x="-64" y="52"  width="44" height="9" rx="4.5" opacity=".9"/>
      <rect x="-64" y="78"  width="44" height="9" rx="4.5" opacity=".9"/>
      <rect x="-64" y="104" width="44" height="9" rx="4.5" opacity=".9"/>
      <rect x="-64" y="130" width="44" height="9" rx="4.5" opacity=".9"/>
      <rect x="-64" y="156" width="44" height="9" rx="4.5" opacity=".9"/>
      <rect x="-64" y="182" width="44" height="9" rx="4.5" opacity=".9"/>
    </g>
  </g>

  <g transform="translate(72 96)">
    <rect x="0" y="-34" width="38" height="38" rx="11" fill="url(#accent)"/>
    <text x="19" y="-8" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="19" font-weight="700" fill="#14121f" text-anchor="middle">◆</text>

    <text x="56" y="-6" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="34" font-weight="700" fill="#f2f3f8" letter-spacing="-0.8">Claude Code Chat Archive</text>

    <text x="0" y="46" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="19" font-weight="500" fill="#a8adc0">Claude Code deletes your transcripts after 30 days.</text>
    <text x="0" y="76" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="19" font-weight="700" fill="#8b87ff">This keeps them — browsable, searchable, forever.</text>

    <rect x="0" y="100" width="300" height="2" rx="1" fill="url(#fade)"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#6f7686">
      <text x="0" y="134">python3 export_claude_chats.py</text>
      <text x="0" y="158" fill="#4fd1c5">→ open index.html</text>
    </g>
  </g>
</svg>
